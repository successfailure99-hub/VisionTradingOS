name: VM-19 Certification

on:
  push:
    branches:
      - develop
      - milestone/vm19-v1-final-certification
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  vm19:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile
        run: python -m compileall -q .

      - name: VM-19 focused certification
        run: python -m pytest tests/test_vm_19_v1_final_certification.py -v

      - name: Zerodha ticker reconnect recovery regression
        run: python -m pytest tests/test_zerodha_ticker_client.py -v

      - name: Diff check
        run: git diff --check
